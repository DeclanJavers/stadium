[package]
name = "stadium-viewer"
version = "0.1.0"
edition = "2021"
description = "Real-time viewer for Stadium Kit glTF exports (wgpu/Metal)"

[dependencies]
wgpu = "23.0.1"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false

[workspace]
members = [".", "gen"]
