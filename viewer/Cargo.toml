[package]
name = "stadium-viewer"
version = "0.1.0"
edition = "2021"
description = "Stadium Kit viewer and live stadium editor (wgpu/Metal, egui)"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
serde_json = "1"
stadium-gen = { path = "gen" }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false }
rfd = "0.17"

[profile.release]
debug = false

[workspace]
members = [".", "gen"]
