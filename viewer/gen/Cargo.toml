[package]
name = "stadium-gen"
version = "0.1.0"
edition = "2021"
description = "Runtime stadium generator: a port of the Stadium Kit's Python generators (sightlines, stands, roofs, facades, floodlights, ads, pitch)"

[dependencies]
glam = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
